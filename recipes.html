<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FitDesi — Recipes</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7ed99a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script>try{if(localStorage.getItem("fitdesi_theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="recipes.css" />
  </head>
  <body>
    <!-- APP HEADER -->
    <header class="app-header">
      <div class="app-header-title">Recipes</div>
      <div class="header-date" id="currentDate"></div>
    </header>

    <!-- CUISINE TOGGLE -->
    <div class="cuisine-switcher">
      <button class="cuisine-btn active" data-cuisine="indian">🇮🇳 Indian</button>
      <button class="cuisine-btn" data-cuisine="canadian">🇨🇦 Canadian</button>
    </div>

    <!-- CATEGORY FILTER -->
    <div class="category-scroll">
      <button class="cat-btn active" data-cat="all">All</button>
      <button class="cat-btn" data-cat="breakfast">Breakfast</button>
      <button class="cat-btn" data-cat="lunch">Lunch</button>
      <button class="cat-btn" data-cat="dinner">Dinner</button>
      <button class="cat-btn" data-cat="snack">Snacks</button>
    </div>

    <!-- SEARCH -->
    <div class="search-container">
      <input
        type="text"
        id="recipeSearch"
        placeholder="Search recipes..."
        class="search-input"
      />
      <span class="search-icon">🔍</span>
    </div>

    <!-- RECIPE LIST -->
    <div class="recipe-list" id="recipeList">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🍛</div>
        <div class="empty-title">No recipes yet</div>
        <div class="empty-desc">Add recipes from the admin panel</div>
      </div>
    </div>

    <!-- RECIPE DETAIL PANEL -->
    <div class="detail-panel hidden" id="detailPanel">
      <div class="detail-header">
        <button class="detail-back" id="detailBack">← Back</button>
        <div class="detail-icon" id="detailIcon"></div>
      </div>
      <div class="detail-body">
        <div class="detail-name" id="detailName"></div>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="macro-grid" id="detailMacros"></div>
        <div class="detail-section-label">Ingredients</div>
        <div class="detail-ingredients" id="detailIngredients"></div>
        <div class="detail-section-label" id="instructionsLabel" style="display:none">How to make it</div>
        <div class="detail-instructions" id="detailInstructions"></div>
        <div class="detail-section-label" id="videoLabel" style="display:none">How to cook</div>
        <div class="detail-video" id="detailVideo"></div>
        <button class="add-to-meal-btn" id="addToMealBtn">+ Add to Today's Meals</button>
      </div>
    </div>

    <!-- MEAL SELECTOR MODAL -->
    <div class="modal-overlay" id="mealSelectorModal">
      <div class="modal" style="max-width: 360px">
        <div class="modal-header">
          <h2>Add to which meal?</h2>
          <button class="modal-close" id="mealSelectorClose">✕</button>
        </div>
        <p style="font-size:12px; color:rgba(255,255,255,0.3); margin-bottom:16px" id="mealSelectorRecipeName"></p>
        <div class="meal-selector-grid">
          <button class="meal-sel-btn" data-meal="breakfast">
            <span class="meal-sel-icon">🌅</span>
            <span class="meal-sel-name">Breakfast</span>
          </button>
          <button class="meal-sel-btn" data-meal="lunch">
            <span class="meal-sel-icon">☀️</span>
            <span class="meal-sel-name">Lunch</span>
          </button>
          <button class="meal-sel-btn" data-meal="snack">
            <span class="meal-sel-icon">🍎</span>
            <span class="meal-sel-name">Snacks</span>
          </button>
          <button class="meal-sel-btn" data-meal="dinner">
            <span class="meal-sel-icon">🌙</span>
            <span class="meal-sel-name">Dinner</span>
          </button>
        </div>
        <button class="save-btn" id="confirmAddMeal">Confirm</button>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <a href="recipes.html" class="nav-item active" data-page="recipes">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
          <path d="M8 12h8M12 8v8"/>
        </svg>
        <span>Recipes</span>
      </a>
      <a href="tracker.html" class="nav-item" data-page="nutrition">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3h18v4H3zM3 10h18v4H3zM3 17h18v4H3z"/>
        </svg>
        <span>Nutrition</span>
      </a>
      <a href="index.html" class="nav-item home-tab" data-page="home">
        <div class="home-tab-ring">
          <svg width="58" height="58" viewBox="0 0 58 58">
            <circle cx="29" cy="29" r="22" fill="none" stroke="#1a2e1e" stroke-width="4"/>
            <circle cx="29" cy="29" r="22" fill="none" stroke="#7ed99a" stroke-width="4"
              stroke-dasharray="138.2" stroke-dashoffset="138.2"
              stroke-linecap="round" transform="rotate(-90 29 29)"
              id="navProteinRing" class="nav-protein-ring"/>
          </svg>
          <svg class="home-tab-icon" style="position:relative;z-index:1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7ed99a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <span>Home</span>
      </a>
      <a href="exercise.html" class="nav-item" data-page="workout">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 6.5h11M6.5 17.5h11M4 12h16M4 12l-2-2M4 12l-2 2M20 12l2-2M20 12l2 2"/>
        </svg>
        <span>Workout</span>
      </a>
      <a href="profile.html" class="nav-item" data-page="profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Profile</span>
      </a>
    </nav>

    <script type="module" src="recipes.js"></script>

    <!-- Coach -->
    <script type="module">
      import { initCoach } from './coach.js';
      initCoach();
    </script>
    <script>
      /* Nav protein ring */
      (function() {
        const goal = parseInt(localStorage.getItem("proteinGoal") || "0");
        if (!goal) return;
        const data = JSON.parse(localStorage.getItem("proteinData") || "{}");
        const protein = data[new Date().toDateString()] || 0;
        const ring = document.getElementById("navProteinRing");
        if (ring) ring.setAttribute("stroke-dashoffset", (138.2 * (1 - Math.min(protein / goal, 1))).toFixed(1));
      })();
    </script>
  </body>
</html>
