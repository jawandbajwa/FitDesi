<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitDesi — Recipes</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="recipes.css" />
  </head>
  <body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <nav>
      <a href="index.html" class="back-btn">← Back</a>
      <div class="logo">FitDesi <span>personal</span></div>
      <div class="nav-right">
        <div class="nav-date" id="currentDate"></div>
      </div>
    </nav>

    <div class="page-header">
      <h1>Recipes <em>Cookbook</em></h1>
      <p>Indian vegetarian · Canadian plant-based</p>
    </div>

    <!-- CUISINE TOGGLE -->
    <div class="cuisine-switcher">
      <button class="cuisine-btn active" data-cuisine="indian">
        🇮🇳 Indian
      </button>
      <button class="cuisine-btn" data-cuisine="canadian">🇨🇦 Canadian</button>
    </div>

    <!-- CATEGORY FILTER -->
    <div class="category-scroll">
      <button class="cat-btn active" data-cat="all">All</button>
      <button class="cat-btn" data-cat="breakfast">Breakfast</button>
      <button class="cat-btn" data-cat="lunch">Lunch</button>
      <button class="cat-btn" data-cat="dinner">Dinner</button>
      <button class="cat-btn" data-cat="snack">Snacks</button>
    </div>

    <!-- SEARCH -->
    <div class="search-container">
      <input
        type="text"
        id="recipeSearch"
        placeholder="Search recipes..."
        class="search-input"
      />
      <span class="search-icon">🔍</span>
    </div>

    <!-- RECIPE LIST -->
    <div class="recipe-list" id="recipeList">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🍛</div>
        <div class="empty-title">No recipes yet</div>
        <div class="empty-desc">Add recipes from the admin panel</div>
      </div>
    </div>

    <!-- RECIPE DETAIL PANEL -->
    <div class="detail-panel hidden" id="detailPanel">
      <div class="detail-header">
        <button class="detail-back" id="detailBack">← Back</button>
        <div class="detail-icon" id="detailIcon"></div>
      </div>
      <div class="detail-body">
        <div class="detail-name" id="detailName"></div>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="macro-grid" id="detailMacros"></div>
        <div class="detail-section-label">Ingredients</div>
        <div class="detail-ingredients" id="detailIngredients"></div>
        <div
          class="detail-section-label"
          id="instructionsLabel"
          style="display: none"
        >
          How to make it
        </div>
        <div class="detail-instructions" id="detailInstructions"></div>
        <div class="detail-section-label" id="videoLabel" style="display: none">
          How to cook
        </div>
        <div class="detail-video" id="detailVideo"></div>
        <button class="add-to-meal-btn" id="addToMealBtn">
          + Add to Today's Meals
        </button>
      </div>
    </div>

    <!-- MEAL SELECTOR MODAL -->
    <div class="modal-overlay" id="mealSelectorModal">
      <div class="modal" style="max-width: 360px">
        <div class="modal-header">
          <h2>Add to which meal?</h2>
          <button class="modal-close" id="mealSelectorClose">✕</button>
        </div>
        <p
          style="
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 16px;
          "
          id="mealSelectorRecipeName"
        ></p>
        <div class="meal-selector-grid">
          <button class="meal-sel-btn" data-meal="breakfast">
            <span class="meal-sel-icon">🌅</span>
            <span class="meal-sel-name">Breakfast</span>
          </button>
          <button class="meal-sel-btn" data-meal="lunch">
            <span class="meal-sel-icon">☀️</span>
            <span class="meal-sel-name">Lunch</span>
          </button>
          <button class="meal-sel-btn" data-meal="snack">
            <span class="meal-sel-icon">🍎</span>
            <span class="meal-sel-name">Snacks</span>
          </button>
          <button class="meal-sel-btn" data-meal="dinner">
            <span class="meal-sel-icon">🌙</span>
            <span class="meal-sel-name">Dinner</span>
          </button>
        </div>
        <button class="save-btn" id="confirmAddMeal">Confirm</button>
      </div>
    </div>

    <script type="module" src="recipes.js"></script>
  </body>
</html>
