<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitDesi — Exercise</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="exercise.css" />
  </head>
  <body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <nav>
      <a href="index.html" class="back-btn">← Back</a>
      <div class="logo">FitDesi <span>personal</span></div>
      <div class="nav-right">
        <div class="nav-date" id="currentDate"></div>
      </div>
    </nav>

    <div class="page-header">
      <h1>Exercise <em>Hub</em></h1>
      <p>Your workout today and full exercise library</p>
    </div>

    <!-- MODE SWITCHER -->
    <div class="mode-switcher">
      <button class="mode-btn active" data-mode="workout">💪 My Workout</button>
      <button class="mode-btn" data-mode="library">📚 Exercise Library</button>
    </div>

    <!-- MY WORKOUT VIEW -->
    <div id="workoutView">
      <div
        id="workoutContainer"
        style="padding: 0 32px 48px; position: relative; z-index: 2"
      ></div>
    </div>

    <!-- LIBRARY VIEW -->
    <div id="libraryView" class="hidden">
      <div class="muscle-container">
        <div class="muscle-scroll">
          <button class="muscle-btn" data-muscle="chest">Chest</button>
          <button class="muscle-btn" data-muscle="back">Back</button>
          <button class="muscle-btn" data-muscle="shoulders">Shoulders</button>
          <button class="muscle-btn" data-muscle="biceps">Biceps</button>
          <button class="muscle-btn" data-muscle="triceps">Triceps</button>
          <button class="muscle-btn" data-muscle="forearms">Forearms</button>
          <button class="muscle-btn" data-muscle="abs">Abs</button>
          <button class="muscle-btn" data-muscle="obliques">Obliques</button>
          <button class="muscle-btn" data-muscle="lowerback">Lower Back</button>
          <button class="muscle-btn" data-muscle="glutes">Glutes</button>
          <button class="muscle-btn" data-muscle="quads">Quads</button>
          <button class="muscle-btn" data-muscle="hamstrings">
            Hamstrings
          </button>
          <button class="muscle-btn" data-muscle="calves">Calves</button>
          <button class="muscle-btn" data-muscle="traps">Traps</button>
          <button class="muscle-btn" data-muscle="lats">Lats</button>
          <button class="muscle-btn" data-muscle="reardelts">Rear Delts</button>
        </div>
      </div>
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Search exercises..."
          class="search-input"
        />
        <span class="search-icon">🔍</span>
      </div>
      <div class="exercise-grid" id="exerciseGrid"></div>
    </div>

    <!-- SET SELECTOR POPUP -->
    <div class="modal-overlay" id="setPopupModal">
      <div class="modal" style="max-width: 380px; text-align: center">
        <div style="font-size: 36px; margin-bottom: 12px">🔄</div>
        <h2
          style="
            font-size: 20px;
            font-weight: 500;
            color: #f0f0f0;
            margin-bottom: 8px;
          "
        >
          New Cycle Starting!
        </h2>
        <p
          style="
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 24px;
            line-height: 1.6;
          "
        >
          You completed a full cycle. Which set do you want for this cycle?
        </p>
        <div style="display: flex; gap: 12px">
          <button
            id="chooseSetA"
            style="
              flex: 1;
              padding: 16px;
              background: rgba(126, 217, 154, 0.1);
              border: 0.5px solid #7ed99a;
              border-radius: 14px;
              color: #7ed99a;
              font-size: 16px;
              font-weight: 500;
              cursor: pointer;
              font-family: Inter, sans-serif;
            "
          >
            Set A
            <div
              style="
                font-size: 11px;
                color: rgba(126, 217, 154, 0.5);
                margin-top: 4px;
                font-weight: 400;
              "
            >
              Original exercises
            </div>
          </button>
          <button
            id="chooseSetB"
            style="
              flex: 1;
              padding: 16px;
              background: rgba(255, 255, 255, 0.03);
              border: 0.5px solid rgba(255, 255, 255, 0.15);
              border-radius: 14px;
              color: rgba(255, 255, 255, 0.6);
              font-size: 16px;
              font-weight: 500;
              cursor: pointer;
              font-family: Inter, sans-serif;
            "
          >
            Set B
            <div
              style="
                font-size: 11px;
                color: rgba(255, 255, 255, 0.25);
                margin-top: 4px;
                font-weight: 400;
              "
            >
              Variation exercises
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- CUSTOM SPLIT MODAL -->
    <div class="modal-overlay" id="customSplitModal">
      <div class="modal" style="max-width: 520px">
        <div class="modal-header">
          <h2>Create Custom Split</h2>
          <button class="modal-close" id="customSplitClose">✕</button>
        </div>
        <p
          style="
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 20px;
          "
        >
          Pick muscle groups for each day of your cycle
        </p>
        <div id="customSplitDays"></div>
        <div style="margin-top: 16px; display: flex; gap: 10px">
          <button
            id="addCustomDay"
            style="
              padding: 10px 16px;
              background: rgba(255, 255, 255, 0.03);
              border: 0.5px solid rgba(255, 255, 255, 0.1);
              border-radius: 10px;
              color: rgba(255, 255, 255, 0.4);
              font-size: 12px;
              cursor: pointer;
              font-family: Inter, sans-serif;
            "
          >
            + Add Day
          </button>
        </div>
        <button class="save-btn" id="saveCustomSplit" style="margin-top: 16px">
          Save Custom Split
        </button>
      </div>
    </div>

    <script type="module" src="exercise.js"></script>
  </body>
</html>
