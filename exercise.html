<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="icon-192.png" />
    <title>FitDesi — Workout</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7ed99a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script>
      try {
        if (localStorage.getItem("fitdesi_theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="exercise.css" />
  </head>
  <body>
    <!-- APP HEADER -->
    <header class="app-header">
      <div class="app-header-title">Workout</div>
      <div class="header-date" id="currentDate"></div>
    </header>

    <!-- WEEK VIEW -->
    <div class="week-view-wrap">
      <div class="week-grid" id="weekGrid"></div>
    </div>

    <!-- MODE SWITCHER (seg-control style) -->
    <div class="seg-control" style="margin: 0 16px 16px">
      <button class="seg-btn active" data-mode="workout">My Workout</button>
      <button class="seg-btn" data-mode="library">Exercise Library</button>
    </div>

    <!-- MY WORKOUT VIEW -->
    <div id="workoutView">
      <div id="workoutContainer" class="workout-container"></div>
    </div>

    <!-- LIBRARY VIEW -->
    <div id="libraryView" class="hidden">
      <div class="muscle-container">
        <div class="muscle-scroll">
          <button class="muscle-btn" data-muscle="chest">Chest</button>
          <button class="muscle-btn" data-muscle="back">Back</button>
          <button class="muscle-btn" data-muscle="shoulders">Shoulders</button>
          <button class="muscle-btn" data-muscle="biceps">Biceps</button>
          <button class="muscle-btn" data-muscle="triceps">Triceps</button>
          <button class="muscle-btn" data-muscle="forearms">Forearms</button>
          <button class="muscle-btn" data-muscle="abs">Abs</button>
          <button class="muscle-btn" data-muscle="obliques">Obliques</button>
          <button class="muscle-btn" data-muscle="lowerback">Lower Back</button>
          <button class="muscle-btn" data-muscle="glutes">Glutes</button>
          <button class="muscle-btn" data-muscle="quads">Quads</button>
          <button class="muscle-btn" data-muscle="hamstrings">
            Hamstrings
          </button>
          <button class="muscle-btn" data-muscle="calves">Calves</button>
          <button class="muscle-btn" data-muscle="traps">Traps</button>
          <button class="muscle-btn" data-muscle="lats">Lats</button>
          <button class="muscle-btn" data-muscle="reardelts">Rear Delts</button>
        </div>
      </div>
      <div class="search-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Search exercises..."
          class="search-input"
        />
        <span class="search-icon">🔍</span>
      </div>
      <div class="exercise-grid" id="exerciseGrid"></div>
    </div>

    <!-- SET SELECTOR POPUP -->
    <div class="modal-overlay" id="setPopupModal">
      <div class="modal" style="max-width: 380px; text-align: center">
        <div style="font-size: 36px; margin-bottom: 12px">🔄</div>
        <h2
          style="
            font-size: 20px;
            font-weight: 500;
            color: #f0f0f0;
            margin-bottom: 8px;
          "
        >
          New Cycle Starting!
        </h2>
        <p
          style="
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 24px;
            line-height: 1.6;
          "
        >
          You completed a full cycle. Which set do you want for this cycle?
        </p>
        <div style="display: flex; gap: 12px">
          <button
            id="chooseSetA"
            style="
              flex: 1;
              padding: 16px;
              background: rgba(126, 217, 154, 0.1);
              border: 0.5px solid #7ed99a;
              border-radius: 14px;
              color: #7ed99a;
              font-size: 16px;
              font-weight: 500;
              cursor: pointer;
              font-family: Inter, sans-serif;
            "
          >
            Set A
            <div
              style="
                font-size: 11px;
                color: rgba(126, 217, 154, 0.5);
                margin-top: 4px;
                font-weight: 400;
              "
            >
              Original exercises
            </div>
          </button>
          <button
            id="chooseSetB"
            style="
              flex: 1;
              padding: 16px;
              background: rgba(255, 255, 255, 0.03);
              border: 0.5px solid rgba(255, 255, 255, 0.15);
              border-radius: 14px;
              color: rgba(255, 255, 255, 0.6);
              font-size: 16px;
              font-weight: 500;
              cursor: pointer;
              font-family: Inter, sans-serif;
            "
          >
            Set B
            <div
              style="
                font-size: 11px;
                color: rgba(255, 255, 255, 0.25);
                margin-top: 4px;
                font-weight: 400;
              "
            >
              Variation exercises
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- CUSTOM SPLIT MODAL -->
    <div class="modal-overlay" id="customSplitModal">
      <div class="modal" style="max-width: 520px">
        <div class="modal-header">
          <h2>Create Custom Split</h2>
          <button class="modal-close" id="customSplitClose">✕</button>
        </div>
        <p
          style="
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 20px;
          "
        >
          Pick muscle groups for each day of your cycle
        </p>
        <div id="customSplitDays"></div>
        <div style="margin-top: 16px; display: flex; gap: 10px">
          <button
            id="addCustomDay"
            style="
              padding: 10px 16px;
              background: rgba(255, 255, 255, 0.03);
              border: 0.5px solid rgba(255, 255, 255, 0.1);
              border-radius: 10px;
              color: rgba(255, 255, 255, 0.4);
              font-size: 12px;
              cursor: pointer;
              font-family: Inter, sans-serif;
            "
          >
            + Add Day
          </button>
        </div>
        <button class="save-btn" id="saveCustomSplit" style="margin-top: 16px">
          Save Custom Split
        </button>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <a href="recipes.html" class="nav-item" data-page="recipes">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"
          />
          <path d="M8 12h8M12 8v8" />
        </svg>
        <span>Recipes</span>
      </a>
      <a href="tracker.html" class="nav-item" data-page="nutrition">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 3h18v4H3zM3 10h18v4H3zM3 17h18v4H3z" />
        </svg>
        <span>Nutrition</span>
      </a>
      <a href="index.html" class="nav-item home-tab" data-page="home">
        <div class="home-tab-ring">
          <svg width="58" height="58" viewBox="0 0 58 58">
            <circle
              cx="29"
              cy="29"
              r="22"
              fill="none"
              stroke="#1a2e1e"
              stroke-width="4"
            />
            <circle
              cx="29"
              cy="29"
              r="22"
              fill="none"
              stroke="#7ed99a"
              stroke-width="4"
              stroke-dasharray="138.2"
              stroke-dashoffset="138.2"
              stroke-linecap="round"
              transform="rotate(-90 29 29)"
              id="navProteinRing"
              class="nav-protein-ring"
            />
          </svg>
          <svg
            class="home-tab-icon"
            style="position: relative; z-index: 1"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#7ed99a"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </div>
        <span>Home</span>
      </a>
      <a href="exercise.html" class="nav-item active" data-page="workout">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M6.5 6.5h11M6.5 17.5h11M4 12h16M4 12l-2-2M4 12l-2 2M20 12l2-2M20 12l2 2"
          />
        </svg>
        <span>Workout</span>
      </a>
      <a href="profile.html" class="nav-item" data-page="profile">
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        <span>Profile</span>
      </a>
    </nav>

    <script>
      // Week view builder
      (function () {
        const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
        const today = new Date().getDay(); // 0=Sun
        const todayIdx = today === 0 ? 6 : today - 1;
        const grid = document.getElementById("weekGrid");
        days.forEach((d, i) => {
          const el = document.createElement("div");
          el.className = "week-day" + (i === todayIdx ? " today" : "");
          el.innerHTML = '<div class="week-day-name">' + d + "</div>";
          grid.appendChild(el);
        });
      })();

      // Mode switcher
      document.querySelectorAll(".seg-btn[data-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".seg-btn[data-mode]")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const mode = btn.dataset.mode;
          document
            .getElementById("workoutView")
            .classList.toggle("hidden", mode !== "workout");
          document
            .getElementById("libraryView")
            .classList.toggle("hidden", mode !== "library");
        });
      });
    </script>

    <script type="module" src="exercise.js"></script>

    <!-- Coach -->
    <script type="module">
      async function loadCoach() {
        try {
          const coachModule = await import("./coach.js");
          coachModule.initCoach();
        } catch (error) {
          console.warn("FitDesi coach module not loaded:", error);
        }
      }

      loadCoach();
    </script>
    <script>
      /* Nav protein ring */
      (function () {
        const goal = parseInt(localStorage.getItem("proteinGoal") || "0");
        if (!goal) return;
        const data = JSON.parse(localStorage.getItem("proteinData") || "{}");
        const protein = data[new Date().toDateString()] || 0;
        const ring = document.getElementById("navProteinRing");
        if (ring)
          ring.setAttribute(
            "stroke-dashoffset",
            (138.2 * (1 - Math.min(protein / goal, 1))).toFixed(1),
          );
      })();
    </script>
  </body>
</html>
