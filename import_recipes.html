        async function importAll(recipes, cuisine, label) {
            log.textContent = '';
            write(`Starting ${label} recipe import (${recipes.length} recipes)...`);
            let ok = 0, fail = 0;
            for (const recipe of recipes) {
                try {
                    await saveRecipe(recipe, cuisine);
                    write(`✓ [${recipe.category}] ${recipe.name}`, 'ok');
                    ok++;
                } catch(e) {
                    write(`✗ ${recipe.name} — ${e.message}`, 'err');
                    fail++;
                }
            }
            write(`\nDone! ${ok} imported, ${fail} failed.`, ok > 0 ? 'ok' : 'err');
        }

        document.getElementById('btnIndian').addEventListener('click', async function() {
            this.disabled = true;
            await importAll(indian, 'indian', 'Indian');
            this.disabled = false;
        });

        document.getElementById('btnCanadian').addEventListener('click', async function() {

            this.disabled = false;
