// ── UI ──────────────────────────────────────────────────────────
const btn=document.getElementById("btn"),status=document.getElementById("status"),
      log=document.getElementById("log"),bar=document.getElementById("bar"),
      barWrap=document.getElementById("barWrap"),done=document.getElementById("done"),
      warn=document.getElementById("warn");

function addLog(t,err=false){const d=document.createElement("div");d.className="lr "+(err?"er":"ok");d.textContent=t;log.prepend(d);}

onAuthStateChanged(auth,user=>{
  if(!user){warn.style.display="block";warn.innerHTML='⚠️ Not signed in. <a href="login.html" style="color:inherit;font-weight:600">Sign in →</a>';btn.textContent="Sign in first";btn.disabled=false;btn.onclick=()=>{window.location.href="login.html";};}
  else if(!isAdmin(user)){warn.style.display="block";warn.textContent="⚠️ Admin access required.";btn.textContent="Admin only";btn.disabled=true;}
  else{btn.textContent=`Import All ${R.length} Indian Recipes`;btn.disabled=false;btn.onclick=run;}
});

async function run(){
  btn.disabled=true;barWrap.style.display="block";done.style.display="none";log.innerHTML="";
  let ok=0,fail=0;
  for(let i=0;i<R.length;i++){
    const r=R[i];
    status.textContent=`Saving ${i+1}/${R.length}: ${r.name}…`;
    bar.style.width=((i+1)/R.length*100).toFixed(0)+"%";
    try{await saveRecipe(r,"indian");addLog(`✓ ${r.name}`);ok++;}
    catch(e){addLog(`✗ ${r.name}: ${e.message}`,true);fail++;}
  }
  status.textContent=`Done — ${ok} saved, ${fail} failed.`;
  if(fail===0){done.style.display="block";btn.textContent="✓ Done";}
  else{btn.textContent="Retry";btn.disabled=false;}
}
</script>
