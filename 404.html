<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
    <link rel="icon" href="icon-192.png" />
    <title>FitDesi — Page not found</title>

    <!-- Tell crawlers not to index the 404 itself -->
    <meta name="robots" content="noindex" />

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7ed99a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script>
      try {
        var t = localStorage.getItem("fitdesi_theme");
        if (t === "light" || t === "warm") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .nf-wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 24px;
      }
      .nf-icon {
        font-size: 80px;
        margin-bottom: 16px;
        opacity: 0.9;
      }
      .nf-code {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--green);
        margin-bottom: 12px;
      }
      .nf-title {
        font-size: 28px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 12px;
        max-width: 480px;
        line-height: 1.3;
      }
      .nf-desc {
        font-size: 14px;
        color: var(--text-dim);
        line-height: 1.6;
        max-width: 420px;
        margin-bottom: 8px;
      }
      .nf-path {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 12px;
        color: var(--text-faint);
        background: var(--card);
        border: 0.5px solid var(--border);
        border-radius: 8px;
        padding: 6px 12px;
        margin-bottom: 28px;
        max-width: 90%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nf-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .nf-btn-primary {
        background: rgb(var(--green-rgb) / 0.12);
        border: 0.5px solid var(--green);
        border-radius: 12px;
        color: var(--green);
        font-size: 14px;
        font-weight: 600;
        padding: 12px 24px;
        cursor: pointer;
        font-family: inherit;
        text-decoration: none;
        transition: background 0.15s;
      }
      .nf-btn-primary:hover {
        background: rgb(var(--green-rgb) / 0.2);
      }
      .nf-btn-secondary {
        background: var(--card);
        border: 0.5px solid var(--border);
        border-radius: 12px;
        color: var(--text-dim);
        font-size: 14px;
        font-weight: 500;
        padding: 12px 24px;
        cursor: pointer;
        font-family: inherit;
        text-decoration: none;
        transition: background 0.15s;
      }
      .nf-btn-secondary:hover {
        background: var(--bg);
        color: var(--text);
      }
      .nf-links {
        margin-top: 32px;
        font-size: 12px;
        color: var(--text-faint);
      }
      .nf-links a {
        color: var(--green);
        text-decoration: none;
        margin: 0 6px;
      }
      .nf-links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="nf-wrap">
      <div class="nf-icon">🤔</div>
      <div class="nf-code">404 — Not Found</div>
      <h1 class="nf-title">This page doesn't exist</h1>
      <p class="nf-desc">
        The link may be broken, or the page may have been moved.
      </p>
      <div class="nf-path" id="nfPath"></div>
      <div class="nf-actions">
        <a class="nf-btn-primary" href="/FitDesi/">← Back to FitDesi</a>
        <button type="button" class="nf-btn-secondary" id="nfBackBtn">Go back</button>
      </div>
      <div class="nf-links">
        <a href="/FitDesi/tracker.html">Nutrition</a> ·
        <a href="/FitDesi/recipes.html">Recipes</a> ·
        <a href="/FitDesi/exercise.html">Workouts</a> ·
        <a href="/FitDesi/profile.html">Profile</a>
      </div>
    </main>
    <script>
      // Show the missing URL so the user knows what they typed
      try {
        document.getElementById("nfPath").textContent =
          location.pathname + (location.search || "");
      } catch (e) {}

      // "Go back" — use browser history if available, else home
      document.getElementById("nfBackBtn").addEventListener("click", () => {
        if (history.length > 1) history.back();
        else location.href = "/FitDesi/";
      });
    </script>
  </body>
</html>
