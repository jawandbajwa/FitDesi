        async function importAll(list, label) {
            log.textContent = '';
            write(`Starting ${label} ingredient import (${list.length} items)...`);
            let ok = 0, fail = 0;
            for (const ing of list) {
                try {
                    await saveIngredient(ing);
                    write(`✓ ${ing.name}`, 'ok');
                    ok++;
                } catch (e) {
                    write(`✗ ${ing.name} — ${e.message}`, 'err');
                    fail++;
                }
            }
            write(`\nDone! ${ok} imported, ${fail} failed.`, ok > 0 ? 'ok' : 'err');
        }
