      // ── Auth & UI ─────────────────────────────────────────────
      const btn     = document.getElementById("importBtn");
      const status  = document.getElementById("status");
      const log     = document.getElementById("log");
      const bar     = document.getElementById("bar");
      const barWrap = document.getElementById("barWrap");
      const done    = document.getElementById("doneBanner");
      const warn    = document.getElementById("authWarn");

      function addLog(text, isErr = false) {
        const d = document.createElement("div");
        d.className = "log-row " + (isErr ? "err" : "ok");
        d.textContent = text;
        log.prepend(d);
      }

      onAuthStateChanged(auth, (user) => {
        if (!user) {
          warn.style.display = "block";
          warn.innerHTML = '⚠️ You must be signed in. <a href="login.html" style="color:inherit;font-weight:600">Sign in →</a>';
          btn.textContent = "Sign in first";
          btn.disabled = false;
          btn.onclick = () => { window.location.href = "login.html"; };
        } else if (!isAdmin(user)) {
          warn.style.display = "block";
          warn.textContent = "⚠️ Admin access required to import recipes.";
          btn.textContent = "Admin only";
          btn.disabled = true;
        } else {
          btn.textContent = `Import All ${RECIPES.length} Canadian Recipes`;
          btn.disabled = false;
          btn.onclick = runImport;
        }
      });

      async function runImport() {
        btn.disabled = true;
        barWrap.style.display = "block";
        done.style.display = "none";
        log.innerHTML = "";
        let ok = 0, fail = 0;

        for (let i = 0; i < RECIPES.length; i++) {
          const r = RECIPES[i];
          status.textContent = `Saving ${i + 1} / ${RECIPES.length}: ${r.name}…`;
          bar.style.width = ((i + 1) / RECIPES.length * 100).toFixed(0) + "%";
          try {
            await saveRecipe(r, "canadian");
            addLog(`✓ ${r.name} (${r.category})`);
            ok++;
          } catch (e) {
            addLog(`✗ ${r.name}: ${e.message}`, true);
            fail++;
          }
        }

        status.textContent = `Done — ${ok} imported, ${fail} failed.`;
        bar.style.width = "100%";
        if (fail === 0) {
          done.style.display = "block";
          btn.textContent = "✓ Import complete";
        } else {
          btn.textContent = "Retry failed";
          btn.disabled = false;
          btn.onclick = runImport;
        }
      }
