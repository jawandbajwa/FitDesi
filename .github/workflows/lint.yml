name: Lint

# Runs ESLint + Prettier check on every PR + pushes to main.
# Doesn't fail the build — informational, so a lint regression is
# visible but doesn't block the deploy. Once the codebase is fully
# clean, change `continue-on-error: true` to `false` to enforce.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies
        # No package-lock.json checked in (this repo has no build step),
        # so use plain `npm install` not `npm ci`.
        run: npm install --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check Prettier formatting
        run: npm run format:check
        continue-on-error: true
