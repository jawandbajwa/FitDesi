name: Lint

# Runs ESLint + Prettier check on every PR + pushes to main.
# Doesn't fail the build — informational, so a lint regression is
# visible but doesn't block the deploy. Once the codebase is fully
# clean, change `continue-on-error: true` to `false` to enforce.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Check Prettier formatting
        run: npm run format:check
        continue-on-error: true
