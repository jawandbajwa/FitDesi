<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" />
    <link rel="icon" href="icon-192.png" />
    <title>FitDesi — Sign In</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#7ed99a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <script>
      try {
        if (localStorage.getItem("fitdesi_theme") === "light")
          document.documentElement.setAttribute("data-theme", "light");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        position: relative;
        z-index: 2;
      }

      .login-card {
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.06) 0%,
          rgba(255, 255, 255, 0.01) 100%
        );
        border: 0.5px solid rgba(255, 255, 255, 0.1);
        border-top: 0.5px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        padding: 48px 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .login-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        right: 10%;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.15),
          transparent
        );
      }

      .login-logo {
        font-size: 28px;
        font-weight: 600;
        color: #7ed99a;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      .login-logo span {
        color: rgba(255, 255, 255, 0.2);
        font-size: 12px;
        font-weight: 300;
        letter-spacing: 1px;
        text-transform: lowercase;
        display: block;
        margin-top: 4px;
      }

      .login-divider {
        width: 40px;
        height: 1px;
        background: rgba(126, 217, 154, 0.3);
        margin: 24px auto;
      }

      .login-title {
        font-size: 18px;
        font-weight: 500;
        color: #f0f0f0;
        margin-bottom: 8px;
      }

      .login-subtitle {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.25);
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .google-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        padding: 14px 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 0.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        color: #f0f0f0;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        transition: all 0.2s;
        text-decoration: none;
      }

      .google-btn:hover {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 255, 255, 0.25);
        transform: translateY(-2px);
      }

      .google-icon {
        width: 20px;
        height: 20px;
      }

      .login-footer {
        margin-top: 24px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.15);
        line-height: 1.6;
      }

      .login-error {
        background: rgba(255, 100, 100, 0.08);
        border: 0.5px solid rgba(255, 100, 100, 0.2);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12px;
        color: rgba(255, 150, 150, 0.8);
        margin-bottom: 16px;
        display: none;
      }

      .loading-spinner {
        display: none;
        width: 20px;
        height: 20px;
        border: 2px solid rgba(126, 217, 154, 0.2);
        border-top-color: #7ed99a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="login-page">
      <div class="login-card">
        <div class="login-logo">
          FitDesi
          <span>personal fitness</span>
        </div>

        <div class="login-divider"></div>

        <div class="login-title">Welcome back</div>
        <div class="login-subtitle">
          Sign in with your Google account to access your personal fitness
          dashboard
        </div>

        <div class="login-error" id="loginError"></div>

        <button class="google-btn" id="googleSignIn">
          <svg class="google-icon" viewBox="0 0 24 24">
            <path
              fill="#4285F4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34A853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#FBBC05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            />
            <path
              fill="#EA4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          <span id="btnText">Continue with Google</span>
          <div class="loading-spinner" id="spinner"></div>
        </button>

        <div class="login-footer">
          Your data is private and secure. Each family member has their own
          personal space. We never share your information.
        </div>
      </div>
    </div>

    <script type="module">
      import {
        signInWithGoogle,
        onAuthStateChanged,
        auth,
        getRedirectResult,
      } from "./firebase.js";

      const btn = document.getElementById("googleSignIn");
      const btnText = document.getElementById("btnText");
      const spinner = document.getElementById("spinner");
      const errorEl = document.getElementById("loginError");

      function setLoading(on) {
        btn.disabled = on;
        btnText.textContent = on ? "Signing in…" : "Continue with Google";
        spinner.style.display = on ? "block" : "none";
      }

      // ── Handle iOS redirect result ──────────────────────────
      // After signInWithRedirect() on iOS standalone, Google bounces
      // back here — getRedirectResult() captures the credential.
      (async () => {
        try {
          setLoading(true);
          const result = await getRedirectResult(auth);
          if (result && result.user) {
            window.location.href = "index.html";
            return;
          }
        } catch (e) {
          // No redirect in flight — normal first load
        }
        setLoading(false);
      })();

      // ── Already signed in → go straight to app ─────────────
      onAuthStateChanged(auth, (user) => {
        if (user) window.location.href = "index.html";
      });

      // ── Sign-in button ──────────────────────────────────────
      btn.addEventListener("click", async () => {
        setLoading(true);
        errorEl.style.display = "none";
        try {
          const user = await signInWithGoogle();
          // On iOS standalone, signInWithGoogle triggers a redirect and
          // returns null — result is handled above by getRedirectResult.
          if (user) window.location.href = "index.html";
        } catch (error) {
          setLoading(false);
          errorEl.style.display = "block";
          errorEl.textContent =
            error.code === "auth/popup-blocked"
              ? "Popup blocked. Please allow popups or try a different browser."
              : "Sign in failed. Please try again.";
        }
      });
    </script>
  </body>
</html>
